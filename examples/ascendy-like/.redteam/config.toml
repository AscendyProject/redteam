# redteam harness config — ascendy-backend.
#
# Extraction M1 (step 1): the values here equal the engine's current hardcoded
# defaults. Later steps make the engine read these instead of literals
# (paths/branch/verify in workflows, role→model in adapters), so this file
# becomes the single source of truth for project-specific behavior.
#
# A different repo (e.g. ascendy-frontend) ships its own config.toml with its
# own stack — that's how the harness stays project-agnostic.

[project]
name = "ascendy-backend"
context_file = ".redteam/docs/project-context.md"
security_checklist = ".redteam/docs/security-checklist.md"
test_conventions_file = ".redteam/docs/test-conventions.md"
source_dirs = ["app/"]
test_dir = "tests/"
test_file_glob = "test_*.py"
verify_command = "bash .redteam/scripts/verify.sh"
branch_prefix = "ascendy"
base_branch = "main"

[models]
planner = "claude-opus-4-7"
implementer = "claude-sonnet-4-6"
reviewer = "codex"
rescue = "codex"
